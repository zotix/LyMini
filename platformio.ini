[platformio]
src_dir = .
include_dir = .

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions_lymini_16mb.csv
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
