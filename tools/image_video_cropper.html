<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Media Cropper & Converter for 128x128 ST7735</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
  .box { max-width: 500px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-align: center; }
  canvas { border: 2px solid #58a6ff; width: 256px; height: 256px; image-rendering: pixelated; margin: 15px auto; display: block; background: #000; }
  button { background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin: 5px; }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="box">
  <h2>✂️ Spotpear 128x128 Media Cropper</h2>
  <p>Load any image/photo and export as raw <b>.rgb (RGB565)</b> for LittleFS</p>
  <input type="file" id="fInput" accept="image/*" />
  <canvas id="cv" width="128" height="128"></canvas>
  <div>
    <button id="zIn">Zoom +</button>
    <button id="zOut">Zoom -</button>
    <button id="rot">Rotate</button>
    <button id="dl" style="background:#1f6feb;">💾 Download .rgb File</button>
  </div>
</div>
<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let img = null, z = 1.0, r = 0;
  document.getElementById('fInput').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      img = new Image();
      img.onload = draw;
      img.src = ev.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
  };
  function draw() {
    if (!img) return;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,128,128);
    ctx.save(); ctx.translate(64,64); ctx.rotate(r*Math.PI/180); ctx.scale(z,z);
    const a = img.width/img.height;
    let w=128, h=128;
    if (a>1) { h=128; w=128*a; } else { w=128; h=128/a; }
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();
  }
  document.getElementById('zIn').onclick = () => { z*=1.15; draw(); };
  document.getElementById('zOut').onclick = () => { z/=1.15; draw(); };
  document.getElementById('rot').onclick = () => { r=(r+90)%360; draw(); };
  document.getElementById('dl').onclick = () => {
    const imgData = ctx.getImageData(0, 0, 128, 128);
    const d = imgData.data;

    // Unsharp mask
    const copy = new Uint8ClampedArray(d);
    for (let y = 1; y < 127; ++y) {
      for (let x = 1; x < 127; ++x) {
        const idx = (y * 128 + x) * 4;
        for (let c = 0; c < 3; ++c) {
          const val = copy[idx + c];
          const blur = (copy[((y - 1) * 128 + x) * 4 + c] +
                        copy[((y + 1) * 128 + x) * 4 + c] +
                        copy[(y * 128 + (x - 1)) * 4 + c] +
                        copy[(y * 128 + (x + 1)) * 4 + c]) * 0.25;
          d[idx + c] = Math.min(255, Math.max(0, Math.round(val + 0.45 * (val - blur))));
        }
      }
    }

    // Floyd-Steinberg dithering
    const rBuf = new Float32Array(128 * 128);
    const gBuf = new Float32Array(128 * 128);
    const bBuf = new Float32Array(128 * 128);
    for (let i = 0, j = 0; i < d.length; i += 4, ++j) {
      rBuf[j] = d[i]; gBuf[j] = d[i + 1]; bBuf[j] = d[i + 2];
    }

    const buf = new Uint8Array(128 * 128 * 2);
    let outIdx = 0;
    for (let y = 0; y < 128; ++y) {
      for (let x = 0; x < 128; ++x) {
        const p = y * 128 + x;
        const curR = Math.min(255, Math.max(0, rBuf[p]));
        const curG = Math.min(255, Math.max(0, gBuf[p]));
        const curB = Math.min(255, Math.max(0, bBuf[p]));

        const r5 = Math.min(31, Math.max(0, Math.round(curR * 31 / 255)));
        const g6 = Math.min(63, Math.max(0, Math.round(curG * 63 / 255)));
        const b5 = Math.min(31, Math.max(0, Math.round(curB * 31 / 255)));

        const qR = (r5 * 255 + 15) / 31;
        const qG = (g6 * 255 + 31) / 63;
        const qB = (b5 * 255 + 15) / 31;

        const errR = curR - qR;
        const errG = curG - qG;
        const errB = curB - qB;

        if (x + 1 < 128) {
          const n1 = p + 1;
          rBuf[n1] += errR * 0.4375; gBuf[n1] += errG * 0.4375; bBuf[n1] += errB * 0.4375;
        }
        if (y + 1 < 128) {
          if (x > 0) {
            const n2 = p + 128 - 1;
            rBuf[n2] += errR * 0.1875; gBuf[n2] += errG * 0.1875; bBuf[n2] += errB * 0.1875;
          }
          const n3 = p + 128;
          rBuf[n3] += errR * 0.3125; gBuf[n3] += errG * 0.3125; bBuf[n3] += errB * 0.3125;
          if (x + 1 < 128) {
            const n4 = p + 128 + 1;
            rBuf[n4] += errR * 0.0625; gBuf[n4] += errG * 0.0625; bBuf[n4] += errB * 0.0625;
          }
        }

        const rgb565 = (r5 << 11) | (g6 << 5) | b5;
        buf[outIdx++] = (rgb565 >> 8) & 0xFF;
        buf[outIdx++] = rgb565 & 0xFF;
      }
    }

    const blob = new Blob([buf], {type: 'application/octet-stream'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'photo_128x128.rgb';
    a.click();
  };
</script>
</body>
</html>
